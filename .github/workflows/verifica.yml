name: Verifica dati e tipi

# ⚠️ Workflow SEPARATO da quello di deploy, di proposito. Il deploy pubblica il sito e non
# deve fermarsi per un typecheck: qui si guarda la salute del repo, e un rosso e' un lavoro
# da fare, non un sito da tenere offline. E' la stessa distinzione che il repo fa gia' fra
# `desc` (cio' che si mostra) e `notes` (cio' che serve a chi manutiene).
#
# Copre i due buchi che restavano: `astro check` (il build NON fa typecheck, quindi un
# errore di tipo nel frontmatter di una pagina passava inosservato) e la coerenza fra i
# file di dati, che finora aveva una rete solo per la parte macchina-generata.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Prima i dati: non hanno bisogno di compilare niente, quindi se sono rotti si
      # scopre subito invece che in fondo.
      - name: Coerenza dei dati
        run: npm run validate

      # ⚠️ Gli errori finiscono anche in un'ANNOTAZIONE, non solo nel log. Il log di un run
      # vuole l'autenticazione anche su un repo pubblico (l'API risponde 403 in anonimo),
      # mentre le annotazioni si leggono dalla pagina del commit e dall'endpoint
      # `check-runs`: cosi' il motivo di un rosso si vede senza scaricare nulla.
      - name: Tipi (astro check)
        run: |
          set +e
          out=$(npm run check 2>&1)
          esito=$?
          echo "$out"
          if [ $esito -ne 0 ]; then
            msg=$(printf '%s' "$out" | tail -c 4000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            printf '::error title=astro check::%s\n' "$msg"
          fi
          exit $esito
