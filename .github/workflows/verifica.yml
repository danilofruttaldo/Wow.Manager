name: Verifica dati

# ⚠️ Workflow SEPARATO da quello di deploy, di proposito. Il deploy pubblica il sito e non
# deve fermarsi per un controllo di manutenzione: un rosso qui e' un lavoro da fare, non un
# sito da tenere offline. E' la stessa distinzione che il repo fa gia' fra `desc` (cio' che
# si mostra) e `notes` (cio' che serve a chi manutiene).
#
# ⚠️ QUI NON C'E' `astro check`, ed e' una scelta verificata, non una dimenticanza.
# Provato il 2026-08-04: riporta **91 errori su codice che builda e funziona**. La causa e'
# una sola e si vede a occhio nudo nell'output: le GENERICHE dentro le espressioni del
# template. `@astrojs/check` 0.9.8 legge il `<string>` di `new Set<string>()` come l'apertura
# di un tag, quindi `new Set < string > ()` diventa un confronto — da lì «Property 'has'
# does not exist on type 'boolean'», «HTML element 'section' has no corresponding closing
# tag», «Cannot find name 'cerca'» e tutta la cascata. Il compilatore vero non ha il
# problema: il deploy e' verde e le pagine funzionano.
# Il checker e' semplicemente indietro rispetto ad Astro 7. Prima di rimetterlo qui va
# aggiornato (`@astrojs/check` e `typescript` in devDependencies) e riprovato: se torna
# pulito e' un guadagno, perche' il build il typecheck non lo fa. Lo script `npm run check`
# resta in package.json apposta.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ⚠️ Gli errori finiscono anche in un'ANNOTAZIONE, non solo nel log. Il log di un run
      # vuole l'autenticazione anche su un repo pubblico (l'API risponde 403 in anonimo),
      # mentre le annotazioni si leggono dalla pagina del commit e dall'endpoint
      # `check-runs`: cosi' il motivo di un rosso si vede senza scaricare nulla.
      - name: Coerenza dei dati
        run: |
          set +e
          out=$(npm run validate 2>&1)
          esito=$?
          echo "$out"
          if [ $esito -ne 0 ]; then
            msg=$(printf '%s' "$out" | tail -c 4000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            printf '::error title=validate-data::%s\n' "$msg"
          fi
          exit $esito
